name: lint

# Dispatch-only: this workflow is not part of the sealed build, and its `push`
# trigger fired it on every fork sync -- onto the now-retired ubuntu-20.04 label,
# where it queues indefinitely instead of failing.
on: workflow_dispatch

permissions: "read-all"

jobs:
  lint:
    runs-on: ubuntu-20.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: "3.8"
      - name: Lint the code
        uses: pre-commit/action@v2.0.0

